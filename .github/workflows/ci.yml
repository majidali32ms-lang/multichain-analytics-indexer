name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run pytest

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pip-audit

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7
        env:
          POSTGRES_DB: indexer
          # The service exists only for this job and listens on the runner alone.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11 --extra postgres
      # The coverage table shows the database code; the package-wide floor needs every test.
      - run: >-
          uv run pytest tests/test_storage.py tests/test_postgres.py tests/test_migrations.py
          -rs --cov-fail-under=0
        env:
          MCI_TEST_DATABASE_URL: postgresql://postgres@localhost:5432/indexer

  docker:
    runs-on: ubuntu-latest
    env:
      # A throwaway password for this run's database, never stored anywhere.
      POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7
      - run: docker compose build
      - run: docker compose up --detach --wait
      - run: >-
          curl --fail --silent --show-error --retry 10 --retry-connrefused --retry-delay 2
          http://127.0.0.1:8000/health
      - run: docker compose run --rm indexer --chain all metrics
      - run: docker compose run --rm indexer pq-status
      - run: docker compose exec --no-TTY db psql -U indexer -d indexer -c "SELECT version_num FROM alembic_version"
      - if: always()
        run: docker compose logs
      - if: always()
        run: docker compose down --volumes

  live:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11
      # Free history keys, kept as repository secrets. A test whose key is missing is skipped
      # and says so.
      - run: uv run pytest -m live --no-cov -rs
        env:
          BLOCKSCOUT_API_KEY: ${{ secrets.BLOCKSCOUT_API_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          NODEREAL_API_KEY: ${{ secrets.NODEREAL_API_KEY }}
          ALCHEMY_API_KEY: ${{ secrets.ALCHEMY_API_KEY }}

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11 --group docs
      - run: uv run mkdocs build --strict

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --locked --python 3.11
      - run: uv run python -m build
      - run: uv run twine check dist/*
