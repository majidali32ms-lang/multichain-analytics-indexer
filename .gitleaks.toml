[extend]
useDefault = true

[allowlist]
description = "Addresses and public keys in saved test responses are public chain data"
regexTarget = "line"
regexes = [
    '''"(accountKey|auth-addr|rekey-to|selection-participation-key|state-proof-key|vote-participation-key)": "''',
    # The Falcon public keys of the participants in an Algorand state proof, as the
    # Indexer returns them in a state proof transaction (tests/fixtures/algorand/tx_stpf.json).
    '''"verifying-key": "''',
    # NodeReal's paging cursor, base64 of the category, block and position it stopped at, such
    # as "external:133012680_1062739," (tests/fixtures/evm/history_bsc_nodereal.json).
    '''"pageKey": "''',
    # The output scripts of Bitcoin transactions, hex as Esplora returns them, such as
    # "0014fcb55e69..." for a P2WPKH output (tests/fixtures/bitcoin/).
    '''"scriptpubkey(_asm|_address|_type)?": "''',
    # The ERC-20 contract of an EVM token transfer, as a stored native block holds it, such
    # as "0x5993716127145Bc66Cc4C3B3d8c179a9E95EdEbc" (tests/fixtures/db/indexer-0.6.0.sql),
    # or the BEP-20 contract a saved holder report names (tests/fixtures/evm/holders_*.json).
    '''"token": ?"0x[0-9a-fA-F]{40}"''',
]
